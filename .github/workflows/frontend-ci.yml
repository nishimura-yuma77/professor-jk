name: Frontend CI

on:
  pull_request:
    # The source branch is unrestricted, so blog/**, feature/**, and other
    # branches are checked when their pull request targets dev or main.
    branches:
      - dev
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate font dependency lockfile
        run: npm install --save-dev --save-exact noto-sans-japanese@1.0.0

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock local OGP font dependency"
          git push origin HEAD:${{ github.head_ref }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
